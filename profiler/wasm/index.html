<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="icon" href="favicon.svg">
    <title>Tracy Profiler</title>
    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: none;
        background-color: rgb(60,60,60);
      }

      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      div.emscripten { text-align:center; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; background-color: black; }

      .spinner {
        height: 30px;
        width: 30px;
        margin: 0;
        margin-top: 20px;
        margin-left: 20px;
        display: inline-block;
        vertical-align: top;

        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;

        border-left: 5px solid rgb(235, 235, 235);
        border-right: 5px solid rgb(235, 235, 235);
        border-bottom: 5px solid rgb(235, 235, 235);
        border-top: 5px solid rgb(120, 120, 120);

        border-radius: 100%;
        background-color: rgb(189, 215, 46);
      }

      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

      #status {
        display: inline-block;
        vertical-align: top;
        margin-top: 30px;
        margin-left: 20px;
        font-weight: bold;
        color: whitesmoke;
      }

      #progress {
        height: 20px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <div id="preload">
      <div class="spinner" id='spinner'></div>
      <div class="emscripten" id="status">Downloading...</div>
    </div>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var preloadElement = document.getElementById('preload');

      // --- Multi-trace support ---
      var tracyTracesList = [];
      function fetchTracesList() {
        fetch('/traces')
          .then(response => response.json())
          .then(data => { tracyTracesList = data; })
          .catch(() => { tracyTracesList = []; });
      }
      // Expose to C++
      var Module = {
        preRun: [function() {
            fetchTracesList();
            // Support ?trace=filename query param
            function getQueryParam(name) {
              var url = new URL(window.location.href);
              return url.searchParams.get(name);
            }
            var traceParam = getQueryParam('trace');
            var TRACE_FILENAME = traceParam ? traceParam : 'embed.tracy';
            var fetchFailed = false;
            var xhr = new XMLHttpRequest();
            xhr.open('GET', (traceParam ? '/traces/' + encodeURIComponent(traceParam) : TRACE_FILENAME) + '?t=' + Date.now(), false); // synchronous
            xhr.overrideMimeType('text/plain; charset=x-user-defined');
            xhr.onload = function() {
              if (xhr.status === 200) {
                var s = xhr.responseText;
                var byteArray = new Uint8Array(s.length);
                for (var i = 0; i < s.length; i++) {
                  byteArray[i] = s.charCodeAt(i) & 0xff;
                }
                try { FS.unlink('/embed.tracy'); } catch (e) {}
                FS.writeFile('/embed.tracy', byteArray);
                console.log('embed.tracy written to Emscripten FS, size:', byteArray.length);
              } else {
                fetchFailed = true;
              }
            };
            xhr.onerror = function() {
              fetchFailed = true;
            };
            xhr.send();
            if (fetchFailed) {
              alert('Trace file not found or failed to load. Run with python -m tracy to generate trace files.');
              throw new Error('embed.tracy not found');
            }
        }],
        postRun: [],
        arguments: ['embed.tracy'],
        print: (function() {
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
          };
        })(),
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
            preloadElement.hidden = false;
          } else if (!text) {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            preloadElement.hidden = true;
            spinnerElement.style.display = 'none';
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };

      // Emscripten C++ glue for trace list
      mergeInto(LibraryManager.library, {
        getTraceCount: function() {
          return tracyTracesList.length|0;
        },
        getTraceName: function(idx) {
          if (idx < 0 || idx >= tracyTracesList.length) return 0;
          return allocate(intArrayFromString(tracyTracesList[idx]), 'i8', ALLOC_STACK);
        },
        fetchAndWriteTrace: function(idx) {
          if (idx < 0 || idx >= tracyTracesList.length) return;
          var name = tracyTracesList[idx];
          // Reload page with ?trace=name
          var url = new URL(window.location.href);
          url.searchParams.set('trace', name);
          window.location.href = url.toString();
        }
      });

      Module.setStatus('Downloading...');
      window.onerror = function(event) {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = function(text) {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    <script async type="text/javascript" src="tracy-profiler.js"></script>
    <script>
      // WebSocket auto-reload for embed.tracy changes
      (function() {
        var ws = new WebSocket('ws://' + location.hostname + ':8081');
        ws.onmessage = function(event) {
          if (event.data === 'reload') {
            location.reload();
          }
        };
        ws.onclose = function() {
          // Try to reconnect after 2 seconds
          setTimeout(function() { location.reload(); }, 2000);
        };
      })();
    </script>
  </body>
</html>
